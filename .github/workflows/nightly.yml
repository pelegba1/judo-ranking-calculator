name: nightly

on:
  schedule:
    - cron: '0 3 * * *' # 05:00 Israel time
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc -p .

      - name: Test
        run: npm test

      - name: Run pipeline
        run: npm run pipeline

      - name: Build site
        run: npm run build

      # After the build: if anything above fails, no data is saved.
      - name: Commit updated data
        run: |
          if [ -n "$(git status --porcelain public/data data-cache)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data data-cache
            git commit -m "chore(data): nightly update $(date -u +%F)"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No data changes"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
